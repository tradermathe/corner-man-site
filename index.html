<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow" />
  <title>Cornerman · Your boxing sessions, analysed</title>
  <meta name="description" content="Cornerman records your boxing sessions on your phone, analyses your movement, and gives you feedback and drills." />
  <style>
    :root {
      --navy: #0d1b35;
      --terracotta: #c8633f;
      --cream: #f6f1e7;
      --ink: #1c2435;
      --ink-soft: #4a5468;
      --line: #e2dccd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 64px 24px; flex: 1; }
    .brand { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--terracotta); font-weight: 700; }
    h1 { font-size: 40px; line-height: 1.1; margin: 12px 0 16px; color: var(--navy); }
    .lead { font-size: 18px; color: var(--ink-soft); margin: 0 0 32px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
    .links a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--navy);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
    }
    .contact { font-size: 16px; color: var(--ink); margin-top: 32px; }
    .contact a { color: var(--terracotta); }
    footer { border-top: 1px solid var(--line); }
    .footer-inner { max-width: 640px; margin: 0 auto; padding: 20px 24px; font-size: 14px; color: var(--ink-soft); }
    .footer-inner a { color: var(--ink-soft); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Cornerman</div>
    <h1>Your corner, in your pocket.</h1>
    <p class="lead">
      Cornerman records your boxing sessions on your phone, analyses your
      movement, and calls out drills as you train.
    </p>

    <div class="links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Use</a>
    </div>

    <p class="contact">
      Questions or support? Email
      <a href="mailto:support@corner-man.ai">support@corner-man.ai</a>.
    </p>
  </div>

  <footer>
    <div class="footer-inner">
      Cornerman · Mathe Wieme · United Arab Emirates
    </div>
  </footer>
</body>
</html>
